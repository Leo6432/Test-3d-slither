<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Slither 3D — Leo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* Reset de base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #app { position: fixed; inset: 0; }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px 20px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-panel {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff;
      backdrop-filter: blur(8px);
      min-width: 200px;
    }
    .hud-title { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    #score-value { font-size: 28px; font-weight: bold; color: #7fffcf; text-shadow: 0 0 12px rgba(127, 255, 207, 0.6); }
    #leaderboard { list-style: none; font-size: 14px; line-height: 1.6; }
    #leaderboard li { display: flex; justify-content: space-between; gap: 16px; }
    #leaderboard li .rank { opacity: 0.6; }
    #leaderboard li.me { color: #7fffcf; font-weight: bold; }

    /* ---------- Écran Game Over ---------- */
    #game-over {
      position: fixed; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 20;
    }
    #game-over.visible { display: flex; }
    .go-box {
      background: #14162a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 40px 60px;
      text-align: center;
      color: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .go-title { font-size: 48px; margin-bottom: 10px; color: #ff6b6b; text-shadow: 0 0 20px rgba(255, 107, 107, 0.5); }
    .go-score { font-size: 22px; margin-bottom: 24px; opacity: 0.9; }
    .go-score span { color: #7fffcf; font-weight: bold; }
    .btn {
      background: linear-gradient(135deg, #4cd964, #34c3ff);
      color: #0a0a1a;
      border: none;
      border-radius: 10px;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 20px rgba(68, 195, 255, 0.4);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(68, 195, 255, 0.55); }
    .btn:active { transform: translateY(0); }

    /* ---------- Aide / instructions ---------- */
    #help {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 8px 18px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="hud-panel">
      <div class="hud-title">Score</div>
      <div id="score-value">0</div>
    </div>
    <div class="hud-panel">
      <div class="hud-title">Classement</div>
      <ul id="leaderboard"></ul>
    </div>
  </div>

  <div id="help">Souris : diriger · Clic maintenu / Espace : boost</div>

  <div id="game-over">
    <div class="go-box">
      <div class="go-title">Game Over</div>
      <div class="go-score">Score final : <span id="final-score">0</span></div>
      <button class="btn" id="restart-btn">Rejouer</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // SLITHER 3D — Jeu de serpent 3D inspiré de Slither.io
    // =========================================================================

    // ----- Constantes de jeu -----
    const WORLD_RADIUS = 600;
    const FOOD_COUNT = 400;
    const FOOD_RADIUS = 2.2;
    const EAT_DISTANCE = 3.5;
    const SEGMENT_SPACING = 1.8;
    const BASE_SPEED = 0.9;
    const BOOST_SPEED = 1.9;
    const BOOST_DRAIN = 0.08;
    const BOOST_DROP_CHANCE = 0.05;
    const BOT_COUNT = 6;
    const TURN_SPEED = 0.05;
    const PLAYER_START_LEN = 12;
    const BOT_START_LEN = 15;
    const GROW_PER_FOOD = 0.6;
    const MAX_HISTORY = 500; // longueur max de l'historique de positions

    // ----- État global -----
    let scene, camera, renderer, clock;
    let player, bots = [];
    let foods = [];
    let foodGeo, playerHue = 0.45;
    let gameRunning = true;
    let score = 0;
    let mouse = { x: 0, y: 0 };
    let boosting = false;

    // =========================================================================
    // INITIALISATION
    // =========================================================================
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a1a);
      scene.fog = new THREE.Fog(0x0a0a1a, 150, 700);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, 40, 50);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = false;
      document.getElementById('app').appendChild(renderer.domElement);

      clock = new THREE.Clock();

      const ambient = new THREE.AmbientLight(0xffffff, 0.55);
      scene.add(ambient);
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(100, 200, 100);
      scene.add(dir);
      const point = new THREE.PointLight(0x88ccff, 0.5, 500);
      point.position.set(0, 100, 0);
      scene.add(point);

      createGround();
      foodGeo = new THREE.SphereGeometry(FOOD_RADIUS, 12, 12);

      player = createSnake(PLAYER_START_LEN, playerHue, true);
      for (let i = 0; i < BOT_COUNT; i++) {
        bots.push(createSnake(BOT_START_LEN + Math.random() * 10, 0.0 + i * 0.13, false));
      }

      for (let i = 0; i < FOOD_COUNT; i++) spawnFood();

      updateScoreUI();
      updateLeaderboard();

      window.addEventListener('resize', onResize);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mousedown', () => { if (gameRunning) boosting = true; });
      window.addEventListener('mouseup', () => { boosting = false; });
      window.addEventListener('keydown', e => { if (e.code === 'Space' && gameRunning) { e.preventDefault(); boosting = true; } });
      window.addEventListener('keyup', e => { if (e.code === 'Space') boosting = false; });
      document.getElementById('restart-btn').addEventListener('click', restartGame);

      animate();
    }

    // -------------------------------------------------------------------------
    // SOL
    // -------------------------------------------------------------------------
    function createGround() {
      const groundGeo = new THREE.CircleGeometry(WORLD_RADIUS + 20, 80);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x11142b, roughness: 0.9, metalness: 0.0 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const borderGeo = new THREE.RingGeometry(WORLD_RADIUS, WORLD_RADIUS + 6, 80);
      const borderMat = new THREE.MeshBasicMaterial({ color: 0x3355aa, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
      const border = new THREE.Mesh(borderGeo, borderMat);
      border.rotation.x = -Math.PI / 2;
      border.position.y = 0.1;
      scene.add(border);
    }

    // -------------------------------------------------------------------------
    // CRÉATION D'UN SERPENT
    // Chaque serpent possède un historique de positions (history) qui
    // permet de placer les segments le long du chemin réellement parcouru.
    // -------------------------------------------------------------------------
    function createSnake(length, hue, isPlayer) {
      const group = new THREE.Group();
      const color = new THREE.Color().setHSL(hue, 0.8, 0.55);

      const headMat = new THREE.MeshStandardMaterial({
        color: color,
        emissive: color,
        emissiveIntensity: 0.4,
        roughness: 0.3,
        metalness: 0.2
      });
      const headGeo = new THREE.SphereGeometry(1.6, 20, 20);
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.set(0, 1.6, 0);
      group.add(head);

      // Yeux
      const eyeGeo = new THREE.SphereGeometry(0.35, 10, 10);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const pupilGeo = new THREE.SphereGeometry(0.2, 8, 8);
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      function makeEye(x) {
        const eye = new THREE.Mesh(eyeGeo, eyeMat);
        eye.position.set(x, 2.0, 1.2);
        const pupil = new THREE.Mesh(pupilGeo, pupilMat);
        pupil.position.set(x * 0.5, 2.05, 1.55);
        group.add(eye, pupil);
      }
      makeEye(-0.7);
      makeEye(0.7);

      // Corps : on stocke les segments comme enfants de la scène (pas du group)
      // pour qu'ils suivent l'historique et non la rotation du group.
      const bodyMat = new THREE.MeshStandardMaterial({
        color: color.clone().offsetHSL(0, 0, -0.1),
        emissive: color.clone().offsetHSL(0, 0, -0.1),
        emissiveIntensity: 0.25,
        roughness: 0.4,
        metalness: 0.15
      });
      const segGeo = new THREE.SphereGeometry(1.3, 12, 12);
      const segments = [];
      for (let i = 0; i < length; i++) {
        const s = new THREE.Mesh(segGeo, bodyMat);
        scene.add(s);
        segments.push(s);
      }

      // Position initiale
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * (WORLD_RADIUS - 50);
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;
      const heading = Math.random() * Math.PI * 2;

      group.position.set(x, 0, z);
      group.rotation.y = heading;
      scene.add(group);

      // Historique de positions : on pré-remplit derrière la tête
      const history = [];
      for (let i = 0; i < MAX_HISTORY; i++) {
        history.push({ x: x - Math.sin(heading) * i * SEGMENT_SPACING, z: z - Math.cos(heading) * i * SEGMENT_SPACING });
      }

      return {
        group: group,
        head: head,
        segments: segments,
        segGeo: segGeo,
        bodyMat: bodyMat,
        length: length,
        hue: hue,
        isPlayer: isPlayer,
        heading: heading,
        alive: true,
        history: history,
        histIndex: 0, // index courant dans l'historique circulaire
        botTimer: 0,
        botTarget: new THREE.Vector3(x + (Math.random() - 0.5) * 200, 0, z + (Math.random() - 0.5) * 200)
      };
    }

    // -------------------------------------------------------------------------
    // NOURRITURE
    // -------------------------------------------------------------------------
    function spawnFood(x, z, isDrop) {
      const hue = Math.random();
      const color = new THREE.Color().setHSL(hue, 0.9, 0.6);
      const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.9, roughness: 0.2 });
      const food = new THREE.Mesh(foodGeo, mat);
      let fx, fz;
      if (x !== undefined && z !== undefined) {
        fx = x; fz = z;
      } else {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (WORLD_RADIUS - 20);
        fx = Math.cos(angle) * dist;
        fz = Math.sin(angle) * dist;
      }
      food.position.set(fx, 1.2, fz);
      scene.add(food);
      const foodData = { mesh: food, radius: FOOD_RADIUS, alive: true, drop: isDrop || false };
      foods.push(foodData);
      return foodData;
    }

    function removeFood(fd) {
      scene.remove(fd.mesh);
      fd.mesh.material.dispose();
      fd.alive = false;
    }

    // -------------------------------------------------------------------------
    // MISE À JOUR — JOUEUR
    // -------------------------------------------------------------------------
    function updatePlayer(dt) {
      if (!player.alive) return;

      // Direction cible à partir de la souris
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();
      const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), camDir).normalize();

      // La souris est relative au centre de l'écran :
      //  - souris à droite  -> tourner vers la droite (mouse.x > 0)
      //  - souris en haut   -> tourner vers l'avant (mouse.y < 0)
      const mouseNorm = Math.min(1, Math.hypot(mouse.x, mouse.y) * 1.8);
      const dirX = right.x * mouse.x - camDir.x * mouse.y * mouseNorm;
      const dirZ = right.z * mouse.x - camDir.z * mouse.y * mouseNorm;
      const targetAngle = Math.atan2(dirX, dirZ);

      // Calcul de la différence angulaire avec normalisation à [-π, π]
      let diff = targetAngle - player.heading;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));

      // Vitesse de rotation dynamique :
      //  - de base TURN_SPEED, montée jusqu'à TURN_SPEED * 2 quand la souris est loin
      //  - lissée par un amortissement exponentiel pour éviter les à-coups
      const maxTurn = TURN_SPEED * 2;
      const targetTurnSpeed = TURN_SPEED + (maxTurn - TURN_SPEED) * mouseNorm;
      let desiredTurn = Math.max(-targetTurnSpeed, Math.min(targetTurnSpeed, diff));

      // Amortissement exponentiel (lerp de la vitesse de rotation)
      if (!player._turnVel) player._turnVel = 0;
      player._turnVel += (desiredTurn - player._turnVel) * 0.25;
      player.heading += player._turnVel;

      const speed = boosting ? BOOST_SPEED : BASE_SPEED;

      player.group.position.x += Math.sin(player.heading) * speed;
      player.group.position.z += Math.cos(player.heading) * speed;
      player.group.rotation.y = player.heading;

      // Enregistrer la position dans l'historique circulaire
      pushHistory(player);

      // Contrainte carte
      const dist = Math.hypot(player.group.position.x, player.group.position.z);
      if (dist > WORLD_RADIUS - 5) {
        killSnake(player, "Bord de la carte !");
        return;
      }

      // Boost
      if (boosting) {
        if (player.length > 3) {
          player.length -= BOOST_DRAIN;
          while (player.segments.length > Math.floor(player.length)) {
            const s = player.segments.pop();
            scene.remove(s);
          }
        }
        if (Math.random() < BOOST_DROP_CHANCE) {
          const lastHist = player.history[player.histIndex];
          spawnFood(lastHist.x, lastHist.z, true);
        }
      }

      updateSegments(player);
      eatFood(player);
      checkCollisions();
    }

    // -------------------------------------------------------------------------
    // MISE À JOUR — BOTS
    // -------------------------------------------------------------------------
    function updateBot(bot, dt) {
      if (!bot.alive) return;

      bot.botTimer -= dt;
      if (bot.botTimer <= 0) {
        bot.botTimer = 1.5 + Math.random() * 2;
        const r = Math.random();
        if (r < 0.6) {
          const nearest = findNearestFood(bot.group.position);
          if (nearest) bot.botTarget.copy(nearest.mesh.position);
        } else if (r < 0.85 && player.alive) {
          const future = player.group.position.clone();
          future.x += Math.sin(player.heading) * 20;
          future.z += Math.cos(player.heading) * 20;
          bot.botTarget.copy(future);
        } else {
          const angle = Math.random() * Math.PI * 2;
          const dist = 50 + Math.random() * 100;
          bot.botTarget.set(
            bot.group.position.x + Math.cos(angle) * dist,
            0,
            bot.group.position.z + Math.sin(angle) * dist
          );
        }
      }

      const dx = bot.botTarget.x - bot.group.position.x;
      const dz = bot.botTarget.z - bot.group.position.z;
      const targetAngle = Math.atan2(dx, dz);
      let diff = targetAngle - bot.heading;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      const turn = Math.max(-TURN_SPEED * 0.9, Math.min(TURN_SPEED * 0.9, diff));
      bot.heading += turn;

      const speed = BASE_SPEED * (0.85 + Math.random() * 0.3);
      bot.group.position.x += Math.sin(bot.heading) * speed;
      bot.group.position.z += Math.cos(bot.heading) * speed;
      bot.group.rotation.y = bot.heading;

      const dist = Math.hypot(bot.group.position.x, bot.group.position.z);
      if (dist > WORLD_RADIUS - 5) {
        bot.heading = Math.atan2(-bot.group.position.x, -bot.group.position.z);
        bot.group.position.x = Math.min(Math.max(bot.group.position.x, -(WORLD_RADIUS - 10)), WORLD_RADIUS - 10);
        bot.group.position.z = Math.min(Math.max(bot.group.position.z, -(WORLD_RADIUS - 10)), WORLD_RADIUS - 10);
      }

      pushHistory(bot);
      updateSegments(bot);
      eatFood(bot);
    }

    // -------------------------------------------------------------------------
    // HISTORIQUE DE POSITIONS (tampon circulaire)
    // Chaque frame, on stocke la position courante de la tête.
    // Les segments sont placés aux positions de l'historique à intervalle régulier.
    // -------------------------------------------------------------------------
    function pushHistory(snake) {
      const x = snake.group.position.x;
      const z = snake.group.position.z;
      snake.history[snake.histIndex] = { x: x, z: z };
      snake.histIndex = (snake.histIndex + 1) % MAX_HISTORY;
    }

    function getHistoryAt(snake, framesAgo) {
      const idx = ((snake.histIndex - 1 - framesAgo) % MAX_HISTORY + MAX_HISTORY) % MAX_HISTORY;
      return snake.history[idx];
    }

    // -------------------------------------------------------------------------
    // SUIVI DES SEGMENTS : placé sur l'historique pour un rendu slither.io
    // -------------------------------------------------------------------------
    function updateSegments(snake) {
      const n = snake.segments.length;
      // Espacement en frames : on veut SEGMENT_SPACING unités entre segments.
      // Comme la vitesse est ~0.9/frame, on calcule l'espacement en frames.
      const framesPerSegment = Math.max(1, Math.round(SEGMENT_SPACING / BASE_SPEED));

      for (let i = 0; i < n; i++) {
        const seg = snake.segments[i];
        const h = getHistoryAt(snake, (i + 1) * framesPerSegment);
        seg.position.x = h.x;
        seg.position.y = 1.4;
        seg.position.z = h.z;
      }
    }

    // -------------------------------------------------------------------------
    // MANGER
    // -------------------------------------------------------------------------
    function eatFood(snake) {
      const headPos = snake.group.position;
      for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        if (!f.alive) { foods.splice(i, 1); continue; }
        const dx = headPos.x - f.mesh.position.x;
        const dz = headPos.z - f.mesh.position.z;
        if (dx * dx + dz * dz < EAT_DISTANCE * EAT_DISTANCE) {
          removeFood(f);
          foods.splice(i, 1);
          snake.length += GROW_PER_FOOD;
          addSegment(snake);
          if (snake.isPlayer) {
            score += 10;
            updateScoreUI();
          }
        }
      }
    }

    function addSegment(snake) {
      const s = new THREE.Mesh(snake.segGeo, snake.bodyMat);
      // Place-le à la dernière position de l'historique
      const last = snake.history[snake.histIndex === 0 ? MAX_HISTORY - 1 : snake.histIndex - 1];
      s.position.set(last.x, 1.4, last.z);
      scene.add(s);
      snake.segments.push(s);
    }

    // -------------------------------------------------------------------------
    // COLLISIONS
    // -------------------------------------------------------------------------
    function checkCollisions() {
      const all = [player, ...bots];
      for (const a of all) {
        if (!a.alive) continue;
        const aPos = a.group.position;
        for (const b of all) {
          if (!b.alive) continue;
          if (a === b) {
            for (let i = 3; i < b.segments.length; i++) {
              const s = b.segments[i];
              const dx = aPos.x - s.position.x;
              const dz = aPos.z - s.position.z;
              if (dx * dx + dz * dz < 2.5 * 2.5) {
              a.length += 5;
              for (let j = 0; j < 5; j++) addSegment(a);
              if (a.isPlayer) { score += 50; updateScoreUI(); }
              return;
            }
            }
          } else {
            for (let i = 0; i < b.segments.length; i++) {
              const s = b.segments[i];
              const dx = aPos.x - s.position.x;
              const dz = aPos.z - s.position.z;
              if (dx * dx + dz * dz < 2.5 * 2.5) {
              a.length += 5;
              for (let j = 0; j < 5; j++) addSegment(a);
              if (a.isPlayer) { score += 50; updateScoreUI(); }
              return;
            }
            }
          }
        }
      }
    }

    // -------------------------------------------------------------------------
    // MORT
    // -------------------------------------------------------------------------
    function killSnake(snake, reason) {
      if (!snake.alive) return;
      snake.alive = false;
      for (const s of snake.segments) {
        if (Math.random() < 0.6) {
          spawnFood(s.position.x, s.position.z, true);
        }
        scene.remove(s);
      }
      scene.remove(snake.group);
      snake.head.geometry.dispose();

      if (snake.isPlayer) {
        gameRunning = false;
        document.getElementById('final-score').textContent = score;
        document.getElementById('game-over').classList.add('visible');
        updateLeaderboard();
      } else {
        const idx = bots.indexOf(snake);
        if (idx !== -1) bots.splice(idx, 1);
      }
    }

    // -------------------------------------------------------------------------
    // UTILITAIRES
    // -------------------------------------------------------------------------
    function findNearestFood(pos) {
      let best = null, bestDist = Infinity;
      for (const f of foods) {
        if (!f.alive) continue;
        const dx = pos.x - f.mesh.position.x;
        const dz = pos.z - f.mesh.position.z;
        const d = dx * dx + dz * dz;
        if (d < bestDist) { bestDist = d; best = f; }
      }
      return best;
    }

    function updateScoreUI() {
      document.getElementById('score-value').textContent = score;
    }

    function updateLeaderboard() {
      const leaderboard = [];
      if (player.alive) leaderboard.push({ name: 'Toi', score: score, isPlayer: true });
      for (const b of bots) {
        leaderboard.push({ name: 'Bot ' + Math.round(b.hue * 360) + '°', score: Math.floor(b.length), isPlayer: false });
      }
      leaderboard.sort((a, b) => b.score - a.score);
      const top = leaderboard.slice(0, 5);
      const ul = document.getElementById('leaderboard');
      ul.innerHTML = top.map((e, i) =>
        `<li class="${e.isPlayer ? 'me' : ''}"><span class="rank">${i + 1}.</span><span>${e.name}</span><span>${e.score}</span></li>`
      ).join('');
    }

    // -------------------------------------------------------------------------
    // RESTART
    // -------------------------------------------------------------------------
    function restartGame() {
      [player, ...bots].forEach(s => {
        if (s) {
          s.segments.forEach(seg => scene.remove(seg));
          scene.remove(s.group);
          s.head.geometry.dispose();
        }
      });
      foods.forEach(f => removeFood(f));
      foods = [];
      bots = [];
      score = 0;

      player = createSnake(PLAYER_START_LEN, playerHue, true);
      for (let i = 0; i < BOT_COUNT; i++) {
        bots.push(createSnake(BOT_START_LEN + Math.random() * 10, 0.0 + i * 0.13, false));
      }
      for (let i = 0; i < FOOD_COUNT; i++) spawnFood();

      gameRunning = true;
      document.getElementById('game-over').classList.remove('visible');
      updateScoreUI();
      updateLeaderboard();
    }

    // -------------------------------------------------------------------------
    // ENTRÉES
    // -------------------------------------------------------------------------
    function onMouseMove(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
    }
    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // -------------------------------------------------------------------------
    // CAMÉRA À LA SUIVIE
    // -------------------------------------------------------------------------
    function updateCamera() {
      if (!player.alive) return;
      const dist = 20 + player.length * 0.8;
      const camHeight = dist * 0.9;
      const desired = new THREE.Vector3(
        player.group.position.x,
        camHeight,
        player.group.position.z + dist
      );
      camera.position.lerp(desired, 0.08);
      camera.lookAt(player.group.position.x, 2, player.group.position.z);
    }

    // -------------------------------------------------------------------------
    // BOUCLE PRINCIPALE
    // -------------------------------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (gameRunning) {
        updatePlayer(dt);
        for (const bot of bots) updateBot(bot, dt);
        updateCamera();
        if (Math.floor(clock.elapsedTime * 2) % 2 === 0) updateLeaderboard();
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
